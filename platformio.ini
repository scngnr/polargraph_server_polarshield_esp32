; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
; Pinned to the current espressif32 release so CI does not float.
platform = espressif32@7.1.3
board = nodemcu-32s
framework = arduino

; The script writes src/firmware-build-name.h and prints nothing.
; PlatformIO treats stdout of a ! flag as extra build flags.
build_flags =
    !python3 build-tools/write-firmware-name.py

monitor_speed = 57600

; AccelStepper 1.58 is no longer published in the PlatformIO registry.
; 1.64 is the current release and keeps the same motor API this firmware calls.
; Chrono 1.1.1 is likewise unpublished; 1.2.1 still provides hasPassed/restart.
lib_deps =
    waspinator/AccelStepper@1.64
    thomasfredericks/Chrono@1.2.1
    paulstoffregen/Encoder@1.4.4
    madhephaestus/ESP32Servo@3.2.1

; Vendored, with the Polarshield pin setup in User_Setup.h.
; TFT_eSPI is not fetched from the registry.
